# Render Blueprint: New > Blueprint > pick this repo.
# Secrets marked sync:false are pasted in the dashboard ("Add from .env" takes several at once).
# VAPI_API_KEY isn't needed here: only `yarn vapi:sync` (run from a laptop) talks to the Vapi API.
services:
  - type: web
    name: clinic-insurance-agent
    runtime: node
    plan: free
    region: oregon
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CLINIC_PHONE_NUMBER
        value: "+17072155322"
      - key: STEDI_API_KEY
        sync: false
      # Must match the secret the Vapi assistant sends (set by `yarn vapi:sync`).
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: FRONT_DESK_NUMBER
        sync: false
