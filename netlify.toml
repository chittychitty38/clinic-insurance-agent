# Project site (site/), deployed to Netlify. The agent server itself runs on Render (render.yaml).
[build]
  command = "yarn site:build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# keep-warm.mts pings the Render server every 10 minutes so callers never wait on a cold start.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://clinic-insurance-agent.onrender.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
